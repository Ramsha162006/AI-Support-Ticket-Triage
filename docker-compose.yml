services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
    environment:
    - GCP_API_KEY=${GCP_API_KEY}      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-triage_user}
      MYSQL_PASSWORD: tanzeel
      MYSQL_DATABASE: ${MYSQL_DATABASE:-support_triage}
      REDIS_URL: redis://redis:6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: tanzeel
      MYSQL_DATABASE: ${MYSQL_DATABASE:-support_triage}
      MYSQL_USER: ${MYSQL_USER:-triage_user}
      MYSQL_PASSWORD: tanzeel
    ports:
      - "3310:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6382:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
